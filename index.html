<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazine Learner</title>
    
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mag: {
                            bg: '#fcfaf7',
                            surface: '#ffffff',
                            primary: '#84593c',
                            primaryHover: '#6a4730',
                            primaryLight: '#a67b5b',
                            text: '#222222',
                            muted: '#666666',
                            border: '#e8e2d9',
                            highlight: '#fdf3e7'

                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -5px rgba(0, 0, 0, 0.08)',

                        'card': '0 20px 40px -10px rgba(0,0,0,0.1)',
                    }
                }
            }
        }
    </script>

    <script>
        try {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) {
            console.warn("Storage access restricted");
        }
    </script>

    <style>
        body { overflow-y: scroll; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        ::selection { background: rgba(132, 89, 60, 0.25); color: inherit; }
        html.dark ::selection { background: rgba(166, 123, 91, 0.4); color: inherit; }
        
        .article-content { transition: font-size 0.3s ease; }
        .article-content.text-sm { font-size: 1rem; }
        .article-content.text-base { font-size: 1.125rem; }
        .article-content.text-lg { font-size: 1.25rem; }

        .article-content p { margin-bottom: 1.75rem; line-height: 1.8; color: inherit; }
        .article-content h2 { font-family: 'Playfair Display', serif; font-size: 1.875rem; margin-top: 2.5rem; margin-bottom: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
        html.dark .article-content h2 { color: #a67b5b; }
        html:not(.dark) .article-content h2 { color: #84593c; }

        .article-content blockquote { position: relative; padding-left: 2rem; font-style: italic; margin: 2.5rem 0; font-size: 1.1em; line-height: 1.7; }
        html.dark .article-content blockquote { color: #d1d5db; }
        html:not(.dark) .article-content blockquote { color: #444; }

        .article-content blockquote::before { content: "“"; position: absolute; left: 0; top: -10px; font-size: 3rem; font-family: 'Playfair Display', serif; }
        html.dark .article-content blockquote::before { color: #374151; }
        html:not(.dark) .article-content blockquote::before { color: #e8e2d9; }
        
        .article-content .drop-cap::first-letter { float: left; font-size: 3.5em; line-height: 0.8; padding-right: 0.15em; padding-top: 0.1em; font-family: 'Playfair Display', serif; color: #84593c; }
        html.dark .article-content .drop-cap::first-letter { color: #a67b5b; }

        .article-content ul, .article-content ol { margin: 1.5rem 0 1.5rem 1.5rem; }
        .article-content li { margin-bottom: 0.75rem; }
        .article-content ul li { list-style-type: disc; }
        .article-content ul li::marker { color: #84593c; }
        html.dark .article-content ul li::marker { color: #a67b5b; }
        .article-content ol li { list-style-type: decimal; font-weight: 500;}

        .article-content hr { border: none; text-align: center; margin: 3.5rem 0; }
        .article-content hr::before { content: "✦ \u00A0 ✦ \u00A0 ✦"; font-size: 1.25rem; color: #d1d5db; letter-spacing: 0.5em; }
        html.dark .article-content hr::before { color: #4b5563; }

        .article-content img { border-radius: 1rem; max-width: 100%; height: auto; margin: 2.5rem auto 1rem auto; display: block; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1); }
        html.dark .article-content img { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5); opacity: 0.95; }
        .article-content figcaption { text-align: center; font-size: 0.9rem; color: #6b7280; margin-bottom: 2.5rem; font-style: italic; }
        html.dark .article-content figcaption { color: #9ca3af; }

        .article-content mark { background-color: #fdf3e7; color: inherit; padding: 0.1em 0.3em; border-radius: 0.25rem; }
        html.dark .article-content mark { background-color: rgba(166, 123, 91, 0.2); }
        .article-content strong { font-weight: 600; }

        /* 3D Flip */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); }
        .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        .tooltip-arrow::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: #1f2937 transparent transparent transparent; }
        .tooltip-arrow.tooltip-bottom::after { top: auto; bottom: 100%; border-color: transparent transparent #1f2937 transparent; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-enter { animation: pageEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes pageEnter { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .tooltip-fade-in { animation: tooltipFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes tooltipFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        @media (max-width: 767px) {
            #selection-tooltip {
                position: fixed !important; top: auto !important; bottom: 24px !important; left: 50% !important; transform: translateX(-50%) !important; width: calc(100% - 32px); max-width: 400px; padding: 12px 8px; border-radius: 20px; justify-content: space-between; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); background: rgba(31, 41, 55, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            }
            #selection-tooltip::after { display: none !important; }
            .tooltip-fade-in { animation: slideUpMobile 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important; }
            @keyframes slideUpMobile { from { opacity: 0; transform: translate(-50%, 40px) scale(0.95); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
            #selection-tooltip button { flex-direction: column; padding: 10px 0; gap: 8px; flex: 1; border-radius: 14px; touch-action: manipulation; }
            #selection-tooltip button svg { width: 24px; height: 24px; margin: 0 auto; }
            #selection-tooltip button span { display: block !important; font-size: 12px; font-weight: 500; }
            .tooltip-divider { display: none; }
        }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3.5s ease-in-out forwards; }

        #reading-progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: transparent; z-index: 100; }
        #reading-progress-bar { height: 100%; width: 0%; transition: width 0.1s ease-out; border-radius: 0 4px 4px 0; }
        html.dark #reading-progress-bar { background: #a67b5b; box-shadow: 0 0 10px #a67b5b; }
        html:not(.dark) #reading-progress-bar { background: #84593c; box-shadow: 0 0 10px rgba(132,89,60,0.5); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 10px; }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

    <div id="delete-modal" class="fixed inset-0 z-[100] hidden bg-black/40 backdrop-blur-md flex items-center justify-center p-4 fade-in">

                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>

            <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>

        <button id="btn-copy-text" class="px-3 py-2 sm:py-1.5 text-sm hover:bg-gray-700 rounded-lg transition-colors flex items-center gap-1.5 whitespace-nowrap text-gray-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Копировать
        </button>
    </div>

    <div id="app" class="flex-grow flex flex-col w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">
        <div class="flex-grow flex flex-col items-center justify-center min-h-[50vh]" id="loading-screen">
            <svg class="animate-spin h-10 w-10 text-mag-primary dark:text-mag-primaryLight mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-mag-muted dark:text-gray-400 font-medium">Загрузка Magazine Learner...</p>
        </div>
    </div>

    <script>
        try { if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } } catch (e) {}

        window.safeStorage = {
            get: (key) => { try { return sessionStorage.getItem(key); } catch(e) { return null; } },
            set: (key, val) => { try { sessionStorage.setItem(key, val); } catch(e) {} },
            remove: (key) => { try { sessionStorage.removeItem(key); } catch(e) {} }
        };
        window.safeLocal = {
            get: (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } },
            set: (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} }
        };

        const state = { 
            user: null, profile: null, view: 'auth', dashboardTab: 'articles', articles: [], words: [], 
            currentArticle: null, selectedText: '', selectedContext: '', readerFontSize: 'text-base', unsubs: [], 
            editingWordId: null, flashcards: [], flashcardIndex: 0, flashcardFlipped: false,
            timer: { active: false, remaining: 0, interval: null, isPaused: false },
            bionicActive: false, originalArticleHTML: null,
            quizWords: [], quizIndex: 0, quizScore: 0, quizOptions: []
        };
        
        const elements = {
            app: document.getElementById('app'), tooltip: document.getElementById('selection-tooltip'),
            toast: document.getElementById('toast'), toastMsg: document.getElementById('toast-msg'),
            progressBarContainer: document.getElementById('reading-progress-container'), progressBar: document.getElementById('reading-progress-bar'),
            editModal: document.getElementById('edit-modal'), editInput: document.getElementById('edit-translation-input'),
            deleteModal: document.getElementById('delete-modal'), deleteModalText: document.getElementById('delete-modal-text'),
            confirmDeleteBtn: document.getElementById('confirm-delete-btn')
        };

        window.posMap = { "noun": "сущ.", "verb": "гл.", "adjective": "прил.", "adverb": "нареч.", "pronoun": "мест.", "preposition": "предл.", "conjunction": "союз" };

        let fbApp, fbAuth, fbDb, fbMethods;
        let isLocalMode = false;
        let itemToDelete = null; 
        const appId = "1:364208723805:web:3639e2ddde1f4e84277ab4";

        const firebaseConfig = {
            apiKey: "AIzaSyD7A24gqyocYPVkiMtRFWHoSDRp4egnGh8",
            authDomain: "magazine-learner.firebaseapp.com",
            projectId: "magazine-learner",
            storageBucket: "magazine-learner.firebasestorage.app",
            messagingSenderId: "364208723805",
            appId: appId
        };

        // --- КОНФЕТТИ ---
        window.fireConfetti = function() {
            const colors = ['#84593c', '#a67b5b', '#4ade80', '#fbbf24', '#f59e0b'];
            for(let i=0; i<60; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'fixed';
                conf.style.left = 50 + (Math.random() * 60 - 30) + 'vw';
                conf.style.top = '60vh';
                conf.style.width = Math.random() > 0.5 ? '8px' : '12px';
                conf.style.height = conf.style.width;
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                conf.style.zIndex = '99999';
                conf.style.pointerEvents = 'none';
                conf.style.transition = 'all 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
                document.body.appendChild(conf);
                
                setTimeout(() => {
                    conf.style.transform = `translate(${(Math.random()-0.5)*800}px, ${(Math.random()-0.5)*800 - 400}px) rotate(${Math.random()*720}deg)`;
                    conf.style.opacity = '0';
                }, 10);
                setTimeout(() => conf.remove(), 1500);
            }
        };

        // --- ЭКСПОРТ CSV ---
        window.exportDictionary = function() {
            if(state.words.length === 0) return window.showToast("Словарь пуст!");
            let csvContent = "data:text/csv;charset=utf-8,Word,Translation,Context\n";
            state.words.forEach(w => {
                let text = (w.text || '').replace(/"/g, '""');
                let translation = (w.translation || '').replace(/"/g, '""');
                let context = (w.context || '').replace(/"/g, '""');
                csvContent += `"${text}","${translation}","${context}"\r\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Magazine_Learner_${state.profile}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        };

        // --- QUIZ (ТЕСТ) ---
        window.startQuiz = function() {
            if (state.words.length < 4) {
                window.showToast("Для тестов нужно минимум 4 слова в словаре!");
                return;
            }
            state.quizWords = [...state.words].sort(() => Math.random() - 0.5).slice(0, 10); 
            state.quizIndex = 0;
            state.quizScore = 0;
            window.generateQuizOptions();
            window.navigateTo('quiz');
        };

        window.generateQuizOptions = function() {
            const correctWord = state.quizWords[state.quizIndex];
            let wrongs = state.words.filter(w => w.text !== correctWord.text).sort(() => Math.random() - 0.5).slice(0, 3);
            state.quizOptions = [correctWord, ...wrongs].sort(() => Math.random() - 0.5);
        };

        window.answerQuiz = function(isCorrect, btnElement) {
            const btns = document.querySelectorAll('.quiz-btn');
            btns.forEach(b => b.disabled = true); // Блокируем кнопки
            
            if (isCorrect) {
                state.quizScore++;
                btnElement.classList.remove('bg-white', 'dark:bg-gray-800', 'text-mag-text', 'dark:text-gray-200');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-600', 'scale-105');
                window.fireConfetti();
            } else {
                btnElement.classList.remove('bg-white', 'dark:bg-gray-800', 'text-mag-text', 'dark:text-gray-200');
                btnElement.classList.add('bg-red-500', 'text-white', 'border-red-600');
                // Подсветить правильный
                btns.forEach(b => {
                    if(b.dataset.correct === "true") {
                        b.classList.remove('bg-white', 'dark:bg-gray-800', 'text-mag-text', 'dark:text-gray-200');
                        b.classList.add('bg-green-500', 'text-white', 'border-green-600');
                    }
                });
            }
            
            setTimeout(() => {
                state.quizIndex++;
                if (state.quizIndex >= state.quizWords.length) {
                    window.showToast(`Тест завершен! Правильных ответов: ${state.quizScore} из ${state.quizWords.length}`);
                    window.goHome();
                } else {
                    window.generateQuizOptions();
                    window.renderApp();
                }
            }, 1200);
        };

        /* --- ТАЙМЕР --- */
        window.toggleTimerMenu = function() {
            const menu = document.getElementById('timer-menu');
            if(menu) menu.classList.toggle('hidden');
        };

        window.setTimer = function(minutes) {
            if(state.timer.interval) clearInterval(state.timer.interval);
            state.timer.remaining = minutes * 60;
            state.timer.active = true;
            state.timer.isPaused = false;
            
            state.timer.interval = setInterval(() => {
                if(!state.timer.isPaused && state.timer.remaining > 0) {
                    state.timer.remaining--;
                    window.updateTimerUI();
                } else if (state.timer.remaining <= 0) {
                    clearInterval(state.timer.interval);
                    state.timer.active = false;
                    window.updateTimerUI();
                    window.showToast("Время сессии подошло к концу!");
                }
            }, 1000);
            
            window.updateTimerUI();
            window.toggleTimerMenu();
        };

        window.toggleTimer = function() {
            state.timer.isPaused = !state.timer.isPaused;
            window.updateTimerUI();
        };

        window.stopTimer = function() {
            if(state.timer.interval) clearInterval(state.timer.interval);
            state.timer.active = false;
            state.timer.remaining = 0;
            window.updateTimerUI();
            const menu = document.getElementById('timer-menu');
            if(menu && !menu.classList.contains('hidden')) menu.classList.add('hidden');
        };

        window.updateTimerUI = function() {
            const display = document.getElementById('timer-display-text');
            const controls = document.getElementById('timer-controls');
            const setup = document.getElementById('timer-setup');
            
            if(!display) return;
            
            if(!state.timer.active) {
                display.innerHTML = '⏱ Таймер';
                display.classList.remove('text-mag-primary', 'dark:text-mag-primaryLight', 'animate-pulse');
                if(setup) setup.classList.remove('hidden');
                if(controls) controls.classList.add('hidden');
                return;
            }
            
            const m = Math.floor(state.timer.remaining / 60).toString().padStart(2, '0');
            const s = (state.timer.remaining % 60).toString().padStart(2, '0');
            
            if (state.timer.isPaused) {
                display.innerHTML = `<span class="opacity-50">⏸ ${m}:${s}</span>`;
                display.classList.remove('animate-pulse');
            } else {
                display.innerHTML = `<span class="text-mag-primary dark:text-mag-primaryLight font-bold">⏳ ${m}:${s}</span>`;
                display.classList.add('animate-pulse');
            }
                
            if(setup) setup.classList.add('hidden');
            if(controls) controls.classList.remove('hidden');
            
            const playPauseBtn = document.getElementById('timer-play-pause');
            if(playPauseBtn) {
                playPauseBtn.innerHTML = state.timer.isPaused ? '▶️ Продолжить' : '⏸ Пауза';
            }
        };

        window.checkStreak = function() {
            if (!state.profile) return 0;
            const today = new Date().toDateString();
            let lastRead = window.safeLocal.get('mag_last_read_' + state.profile);
            let streak = parseInt(window.safeLocal.get('mag_streak_' + state.profile)) || 0;

            if (lastRead && lastRead !== today) {
                let yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (lastRead !== yesterday.toDateString()) {
                    streak = 0; 
                    window.safeLocal.set('mag_streak_' + state.profile, streak);
                }
            }
            return streak;
        };

            if (!state.profile) return;

            if (lastRead !== today) {
                let streak = parseInt(window.safeLocal.get('mag_streak_' + state.profile)) || 0;

        window.getSmartTranslation = async function(wordText, contextText) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&dt=bd&q=${encodeURIComponent(wordText)}`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (!data || !data[0]) return wordText;

                const mainTranslation = data[0][0][0].toLowerCase();
                let alternatives = [];

                if (data[1] && Array.isArray(data[1])) {
                    data[1].forEach(posGroup => {
                        if (posGroup[1] && Array.isArray(posGroup[1])) alternatives.push(...posGroup[1].map(w => w.toLowerCase()));
                    });
                }
                
                alternatives = [...new Set(alternatives)].filter(w => w !== mainTranslation);

                if (contextText && contextText.length > wordText.length) {
                    const ctxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(contextText)}`;
                    const ctxRes = await fetch(ctxUrl);
                    const ctxData = await ctxRes.json();
                    
                    if (ctxData && ctxData[0]) {
                        const translatedContext = ctxData[0].map(s => s[0]).join('').toLowerCase();
                        const allWords = [mainTranslation, ...alternatives];
                        
                        for (let w of allWords) {
                            let stem = w;
                            if (w.length > 5) stem = w.slice(0, -2);
                            else if (w.length > 3) stem = w.slice(0, -1);
                            if (translatedContext.includes(stem)) return w;
                        }
                    }
                }

                let finalTranslation = mainTranslation;
                if (alternatives.length > 0) finalTranslation += ", " + alternatives.slice(0, 2).join(', ');
                return finalTranslation;
            } catch (e) { return ""; }
        };

        window.saveToFirestore = async function(type, text) {
            if (!state.user || !state.profile) return;
            
            elements.tooltip.classList.add('hidden');
            window.getSelection().removeAllRanges();

            let translation = "", phonetics = "";

            if (type === 'word') {
                window.showToast("Изучаем и переводим...");
                translation = await window.getSmartTranslation(text, state.selectedContext);
                try {
                    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(text)}`);
                    if(dictRes.ok) {
                        const dictData = await dictRes.json();
                        if(dictData && dictData.length > 0) {
                            const entry = dictData[0];
                            if (entry.phonetic) phonetics = entry.phonetic;
                            else if (entry.phonetics && entry.phonetics.length > 0) {
                                const phoneObj = entry.phonetics.find(p => p.text);
                                if (phoneObj) phonetics = phoneObj.text;
                            }
                        }
                    }
                } catch (e) { }
            }

            const itemObj = { text, translation, phonetics, partOfSpeech: "", context: state.selectedContext, correctCount: 0, profile: state.profile, articleId: state.currentArticle ? state.currentArticle.id : null, articleTitle: state.currentArticle ? state.currentArticle.title : 'Неизвестно', createdAt: Date.now() };

            if (isLocalMode || !fbDb) {
                const key = 'mag_words';
                const arr = JSON.parse(window.safeLocal.get(key) || '[]');
                itemObj.id = 'loc_' + Date.now() + Math.random().toString(36).substring(2, 9);
                arr.push(itemObj);
                window.safeLocal.set(key, JSON.stringify(arr));
                window.showToast(`Сохранено локально в Словарь`);
                if(state.view === 'dashboard') window.setupFirestoreListeners();
                return;
            }

            const { collection, addDoc } = fbMethods;
            const colRef = collection(fbDb, 'artifacts', appId, 'public', 'data', 'saved_words');
                
            try {
                await addDoc(colRef, itemObj);
                window.showToast(`Сохранено в Словарь`);
            } catch (error) { window.showToast("Ошибка сохранения."); }
        };

        window.handleSelection = function() {
            if (state.view !== 'reader') return;
            
            setTimeout(() => {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;
                
                const text = selection.toString().trim();

                if (text.length > 0) {
                    state.selectedText = text;
                    
                    let contextText = '';
                    const range = selection.getRangeAt(0);
                    if(range.startContainer) {
                        const block = range.startContainer.nodeType === 3 ? range.startContainer.parentNode.closest('p, div, blockquote, li, h2') : range.startContainer.closest('p, div, blockquote, li, h2');
                        if(block) {
                            const blockText = block.innerText || block.textContent || '';
                            const sentences = blockText.split(/(?<=[.!?])\s+/);
                            contextText = sentences.find(s => s.includes(text)) || blockText;
                            if(contextText.length > 250) contextText = contextText.substring(0, 250) + "...";
                        }
                    }
                    state.selectedContext = contextText.trim();

                    const rect = range.getBoundingClientRect();
                    elements.tooltip.classList.remove('hidden');
                    
                    setTimeout(() => {
                        const tooltipWidth = elements.tooltip.offsetWidth;
                        const tooltipHeight = elements.tooltip.offsetHeight;
                        const isMobile = window.innerWidth < 768; 

                        if (!isMobile) {
                            let leftPos = rect.left + window.scrollX + (rect.width / 2);
                            const padding = 15;
                            
                            if (leftPos - tooltipWidth/2 < window.scrollX + padding) leftPos = window.scrollX + tooltipWidth/2 + padding;
                            if (leftPos + tooltipWidth/2 > window.innerWidth + window.scrollX - padding) leftPos = window.innerWidth + window.scrollX - tooltipWidth/2 - padding;

                            let topPos = rect.top + window.scrollY - tooltipHeight - 12;
                            
                            if (rect.top < tooltipHeight + 20) {
                                topPos = rect.bottom + window.scrollY + 12;
                                elements.tooltip.classList.add('tooltip-bottom');
                            } else {
                                elements.tooltip.classList.remove('tooltip-bottom');
                            }

                            elements.tooltip.style.position = 'absolute';
                            elements.tooltip.style.top = `${topPos}px`;
                            elements.tooltip.style.left = `${leftPos}px`;
                            elements.tooltip.style.bottom = 'auto';
                            elements.tooltip.style.transform = 'translateX(-50%)';
                        } else {
                            elements.tooltip.style.position = '';
                            elements.tooltip.style.top = '';
                            elements.tooltip.style.left = '';
                            elements.tooltip.style.bottom = '';
                            elements.tooltip.style.transform = '';
                            elements.tooltip.classList.remove('tooltip-bottom');
                        }

                        elements.tooltip.classList.add('tooltip-fade-in');
                    }, 10);
                } else {
                    setTimeout(() => elements.tooltip.classList.add('hidden'), 100);
                }
            }, 50);
        };

        window.markFlashcardResult = async function(knowIt) {
            const card = state.flashcards[state.flashcardIndex];
            
            if (knowIt) {
                const newCount = (card.correctCount || 0) + 1;
                
                if (isLocalMode || !fbDb) {
                    let arr = JSON.parse(window.safeLocal.get('mag_words') || '[]');
                    let idx = arr.findIndex(w => w.id === card.id);
                    if (idx !== -1) { arr[idx].correctCount = newCount; window.safeLocal.set('mag_words', JSON.stringify(arr)); }
                } else {
                    try {
                        const docRef = fbMethods.doc(fbDb, 'artifacts', appId, 'public', 'data', 'saved_words', card.id);
                        await fbMethods.setDoc(docRef, { correctCount: newCount }, { merge: true });
                    } catch(e) { }
                }
                
                card.correctCount = newCount;
                
                if (newCount >= 5) {
                    window.showToast("Слово отлично усвоено! 🌟");
                    state.flashcards.splice(state.flashcardIndex, 1);
                    
                    if (state.flashcards.length === 0) {
                        window.fireConfetti();
                        window.showToast("Тренировка завершена! Вы выучили все слова.");
                        setTimeout(() => window.goHome(), 1500);
                        return;
                    }
                    
                    if (state.flashcardIndex >= state.flashcards.length) state.flashcardIndex = 0;
                    state.flashcardFlipped = false;
                    window.renderApp();
                    return;
                }
            }

            state.flashcardFlipped = false;
            state.flashcardIndex++;
            if (state.flashcardIndex >= state.flashcards.length) state.flashcardIndex = 0;

            const wordId = state.editingWordId;
            
            if (isLocalMode || !fbDb) {
                let arr = JSON.parse(window.safeLocal.get('mag_words') || '[]');
                const wordIndex = arr.findIndex(w => w.id === wordId);
                if (wordIndex !== -1) {
                    arr[wordIndex].translation = newTranslation;
                    window.safeLocal.set('mag_words', JSON.stringify(arr));
                    window.setupFirestoreListeners(); 
                }
            } else {
                try {
                    const { doc, setDoc } = fbMethods;
                    const docRef = doc(fbDb, 'artifacts', appId, 'public', 'data', 'saved_words', wordId);
                    await setDoc(docRef, { translation: newTranslation }, { merge: true });

            window.closeEditModal();

        window.insertHtml = function(tag) {
            const textarea = document.getElementById('admin-content');
            if(!textarea) return;
            let insertStr = '';
            if(tag === 'h2') insertStr = '<h2>Подзаголовок</h2>\n';
            if(tag === 'p') insertStr = '<p>Обычный абзац текста...</p>\n';
            if(tag === 'dropcap') insertStr = '<p class="drop-cap">Первая буква этого абзаца будет большой и красивой. Журнальный стиль.</p>\n';
            if(tag === 'list') insertStr = '<ul>\n  <li>Первый пункт</li>\n  <li>Второй пункт</li>\n</ul>\n';
            if(tag === 'hr') insertStr = '\n<hr>\n';
            if(tag === 'img') insertStr = '<img src="https://images.unsplash.com/photo-1522204523234-8729aa6e3d5f?w=800&q=80" alt="Фото">\n<figcaption>Красивая подпись к фотографии</figcaption>\n';
            if(tag === 'mark') insertStr = '<mark>Выделенный текст</mark>';
            if(tag === 'bold') insertStr = '<strong>Жирный текст</strong>';
            
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + insertStr + text.substring(end);
            textarea.focus();
            if (start === end) { textarea.selectionStart = start; textarea.selectionEnd = start + insertStr.length; }
        };

        window.autoFormatText = function() {
            const textarea = document.getElementById('admin-content');
            if(!textarea || !textarea.value.trim()) return window.showToast("Сначала вставьте текст!");
            
            const blocks = textarea.value.split(/\n\s*\n/);
            let formatted = '';

            blocks.forEach((block, idx) => {
                let cleanBlock = block.trim();
                if (!cleanBlock) return;
                if (cleanBlock.startsWith('<')) { formatted += cleanBlock + '\n\n'; return; }
                const isHeading = cleanBlock.length < 85 && !/[.!?:]$/.test(cleanBlock) && idx !== 0 && !cleanBlock.includes('\n');

                if (idx === 0) formatted += `<p class="drop-cap">${cleanBlock.replace(/\n/g, ' ')}</p>\n\n`;
                else if (isHeading) formatted += `<h2>${cleanBlock}</h2>\n\n`;
                else formatted += `<p>${cleanBlock.replace(/\n/g, ' ')}</p>\n\n`;
            });
            textarea.value = formatted.trim();
            window.showToast("✨ Магия применена!");
        };

                                    ${card.context ? `<p class="text-base md:text-lg text-mag-muted dark:text-gray-400 italic max-w-md mx-auto leading-relaxed">"${contextWithBlank}"</p>` : ''}
                                    
                                    <div class="absolute bottom-8 animate-bounce text-gray-300 dark:text-gray-600">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg> 
                                    </div>
                                </div>

                                <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-mag-primary to-[#6a4730] dark:from-mag-primaryLight dark:to-[#8c6549] text-white rounded-[2rem] shadow-card flex flex-col items-center justify-center p-8 md:p-12 text-center border border-white/10">
                                    <button onclick="event.stopPropagation(); if(window.speechSynthesis){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('${card.text.replace(/'/g, "\\'")}');u.lang='en-US';window.speechSynthesis.speak(u);}" class="absolute top-6 right-6 p-3 bg-white/10 hover:bg-white/20 rounded-full transition-colors backdrop-blur-sm">
                                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"/><path d="M15.932 7.757a.75.75 0 011.061 0 6 6 0 010 8.486.75.75 0 01-1.06-1.061 4.5 4.5 0 000-6.364.75.75 0 010-1.06z"/></svg>
                                    </button>
                                    <p class="text-[10px] md:text-xs font-bold uppercase tracking-[0.2em] text-white/60 mb-6">Перевод</p>
                                    <h2 class="text-4xl md:text-5xl font-serif mb-6 text-white leading-tight font-medium tracking-tight">${card.translation || 'Нет перевода'}</h2>
                                    <div class="flex gap-3 text-base md:text-lg font-medium text-white/90 mb-8 bg-black/10 px-4 py-2 rounded-xl backdrop-blur-sm">
                                        ${card.phonetics ? `<span>${card.phonetics}</span>` : ''}
                                    </div>
                                    ${card.context ? `<p class="text-base md:text-lg text-white/80 italic max-w-md mx-auto leading-relaxed border-t border-white/20 pt-6">"${card.context.replace(new RegExp(`(${card.text})`, 'gi'), `<strong class="text-white bg-black/20 px-1 rounded">$1</strong>`)}"</p>` : ''}
                                </div>

                            </div>
                        </div>

                        <div class="mt-10 w-full max-w-sm mx-auto transition-opacity duration-300 h-16">
                            ${state.flashcardFlipped ? `
                                <div class="flex gap-4 fade-in h-full">
                                    <button onclick="window.markFlashcardResult(false)" class="flex-1 rounded-[1.5rem] bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl border border-red-200 dark:border-red-900/50 text-red-600 dark:text-red-400 font-bold active:scale-95 transition-all shadow-[0_8px_20px_rgba(0,0,0,0.08)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.12)] text-lg flex items-center justify-center gap-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        Снова
                                    </button>
                                    <button onclick="window.markFlashcardResult(true)" class="flex-1 rounded-[1.5rem] bg-gradient-to-r from-green-500 to-green-600 text-white font-bold active:scale-95 transition-all shadow-[0_8px_20px_rgba(34,197,94,0.3)] hover:shadow-[0_8px_30px_rgba(34,197,94,0.4)] text-lg flex items-center justify-center gap-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                        Помню
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }
            else if (state.view === 'quiz') {
                const card = state.quizWords[state.quizIndex];
                
                html = `
                    <nav class="flex justify-between items-center mb-6 md:mb-10 pb-4 border-b border-gray-200/50 dark:border-gray-700/50 page-enter">
                        <button onclick="window.goHome()" class="text-mag-muted dark:text-gray-400 hover:text-mag-primary dark:hover:text-mag-primaryLight transition-all flex items-center gap-2 font-medium bg-white/60 dark:bg-gray-800/60 backdrop-blur-md px-4 py-2 rounded-full shadow-sm hover:shadow-md border border-white/50 dark:border-gray-700/50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> 
                            <span class="hidden sm:inline">Завершить</span>
                        </button>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-mag-primary dark:text-mag-primaryLight">Вопрос ${state.quizIndex + 1} / ${state.quizWords.length}</span>
                        </div>
                    </nav>

                    <div class="flex-grow flex flex-col items-center justify-center max-w-3xl mx-auto w-full px-2 fade-in pb-10">
                        
                        <div class="w-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-[2rem] shadow-[0_20px_40px_-10px_rgba(0,0,0,0.1)] border border-white/50 dark:border-gray-700/50 flex flex-col items-center justify-center p-8 md:p-12 text-center mb-8">
                            <p class="text-[10px] md:text-xs font-bold uppercase tracking-[0.2em] text-mag-primary/60 dark:text-mag-primaryLight/60 mb-6">Выберите правильный перевод</p>
                            <h2 class="text-5xl md:text-6xl font-serif text-mag-text dark:text-gray-100 mb-4 font-medium tracking-tight">${card.text}</h2>
                            <button onclick="if(window.speechSynthesis){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('${card.text.replace(/'/g, "\\'")}');u.lang='en-US';window.speechSynthesis.speak(u);}" class="p-2 text-mag-muted hover:text-purple-500 transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 mb-2 active:scale-95">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"/><path d="M15.932 7.757a.75.75 0 011.061 0 6 6 0 010 8.486.75.75 0 01-1.06-1.061 4.5 4.5 0 000-6.364.75.75 0 010-1.06z"/></svg>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                            ${state.quizOptions.map(opt => `
                                <button data-correct="${opt.text === card.text}" class="quiz-btn w-full p-5 md:p-6 rounded-[1.5rem] bg-white/60 dark:bg-gray-800/60 backdrop-blur-md border-2 border-transparent shadow-sm hover:shadow-md hover:border-mag-primary/50 dark:hover:border-mag-primaryLight/50 transition-all font-bold text-lg md:text-xl active:scale-95 text-center truncate text-mag-text dark:text-gray-200" onclick="window.answerQuiz(${opt.text === card.text}, this)">
                                    ${(opt.translation || opt.text).split(';')[0].split(',')[0]}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            elements.app.innerHTML = html;
            
            if(state.view === 'dashboard') {
                window.updateDashboardContent();
                window.updateDashboardTabsUI();
            }
        };

        // ДИНАМИЧЕСКИЙ ЗАПУСК FIREBASE С ПЕРЕХВАТОМ ОШИБОК
        async function bootApplication() {
            const timeout = setTimeout(() => {
                if (state.view === 'auth' || !state.user) {
                    console.warn("Сработало ограничение WebView на загрузку модулей. Запуск локального режима.");
                    isLocalMode = true;
                    window.loadProfileAndNavigate();
                }
            }, 3000); 

            try {
                const fbAppModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const fbAuthModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const fbDbModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                fbMethods = {
                    collection: fbDbModule.collection,
                    doc: fbDbModule.doc,
                    setDoc: fbDbModule.setDoc,
                    deleteDoc: fbDbModule.deleteDoc,
                    onSnapshot: fbDbModule.onSnapshot,
                    addDoc: fbDbModule.addDoc
                };

                fbApp = fbAppModule.initializeApp(firebaseConfig);
                fbAuth = fbAuthModule.getAuth(fbApp);
                fbDb = fbDbModule.getFirestore(fbApp);

                await fbAuthModule.setPersistence(fbAuth, fbAuthModule.inMemoryPersistence).catch(() => {});

                let authPromise;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    authPromise = fbAuthModule.signInWithCustomToken(fbAuth, __initial_auth_token).catch(() => fbAuthModule.signInAnonymously(fbAuth));
                } else {
                    authPromise = fbAuthModule.signInAnonymously(fbAuth);
                }

                await authPromise;

                fbAuthModule.onAuthStateChanged(fbAuth, (user) => {
                    clearTimeout(timeout);
                    if (isLocalMode) return;
                    state.user = user;
                    window.loadProfileAndNavigate();
                });

            } catch (e) {
                console.error("Android System WebView заблокировал Firebase:", e);
                clearTimeout(timeout);
                isLocalMode = true;
                window.loadProfileAndNavigate();
            }
        }

        bootApplication();
    </script>
</body>
</html>
