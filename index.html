<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazine Learner</title>
    
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mag: {
                            bg: '#fcfaf7',
                            surface: '#ffffff',
                            primary: '#84593c',
                            primaryHover: '#6a4730',
                            primaryLight: '#a67b5b',
                            text: '#222222',
                            muted: '#666666',
                            border: '#e8e2d9',
                            highlight: '#fdf3e7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'premium-dark': '0 4px 20px -2px rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>

    <script>
        // Предотвращение мигания белого экрана при загрузке темной темы
        try {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) {
            console.warn("Storage access restricted");
        }
    </script>

    <style>
        body { 
            overflow-y: scroll; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html { scroll-behavior: smooth; }

        ::selection { background: rgba(132, 89, 60, 0.25); color: inherit; }
        html.dark ::selection { background: rgba(166, 123, 91, 0.4); color: inherit; }
        
        .article-content { transition: font-size 0.3s ease; }
        .article-content.text-sm { font-size: 1rem; }
        .article-content.text-base { font-size: 1.125rem; }
        .article-content.text-lg { font-size: 1.25rem; }

        .article-content p { margin-bottom: 1.75rem; line-height: 1.8; color: inherit; }
        .article-content h2 { font-family: 'Playfair Display', serif; font-size: 1.875rem; margin-top: 2.5rem; margin-bottom: 1.25rem; font-weight: 600; }
        
        html.dark .article-content h2 { color: #a67b5b; }
        html:not(.dark) .article-content h2 { color: #84593c; }

        .article-content blockquote { position: relative; padding-left: 2rem; font-style: italic; margin: 2.5rem 0; font-size: 1.1em; line-height: 1.7; }
        html.dark .article-content blockquote { color: #d1d5db; }
        html:not(.dark) .article-content blockquote { color: #444; }

        .article-content blockquote::before { content: "“"; position: absolute; left: 0; top: -10px; font-size: 3rem; font-family: 'Playfair Display', serif; }
        html.dark .article-content blockquote::before { color: #374151; }
        html:not(.dark) .article-content blockquote::before { color: #e8e2d9; }
        
        .article-content .drop-cap::first-letter { float: left; font-size: 3.5em; line-height: 0.8; padding-right: 0.15em; padding-top: 0.1em; font-family: 'Playfair Display', serif; color: #84593c; }
        html.dark .article-content .drop-cap::first-letter { color: #a67b5b; }

        .article-content ul, .article-content ol { margin: 1.5rem 0 1.5rem 1.5rem; }
        .article-content li { margin-bottom: 0.75rem; }
        .article-content ul li { list-style-type: disc; }
        .article-content ul li::marker { color: #84593c; }
        html.dark .article-content ul li::marker { color: #a67b5b; }
        .article-content ol li { list-style-type: decimal; font-weight: 500;}

        .article-content hr { border: none; text-align: center; margin: 3.5rem 0; }
        .article-content hr::before { content: "✦ \u00A0 ✦ \u00A0 ✦"; font-size: 1.25rem; color: #d1d5db; }
        html.dark .article-content hr::before { color: #4b5563; }

        .article-content img { border-radius: 0.75rem; max-width: 100%; height: auto; margin: 2.5rem auto 1rem auto; display: block; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.1); }
        html.dark .article-content img { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4); opacity: 0.9; }
        .article-content figcaption { text-align: center; font-size: 0.9rem; color: #6b7280; margin-bottom: 2.5rem; font-style: italic; }
        html.dark .article-content figcaption { color: #9ca3af; }

        .article-content mark { background-color: #fdf3e7; color: inherit; padding: 0.1em 0.3em; border-radius: 0.25rem; }
        html.dark .article-content mark { background-color: rgba(166, 123, 91, 0.2); }
        .article-content strong { font-weight: 600; }

        /* CSS для Флеш-карточек (3D переворот) */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        /* Тултип (Десктоп) */
        .tooltip-arrow::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: #1f2937 transparent transparent transparent;
        }
        .tooltip-arrow.tooltip-bottom::after {
            top: auto; bottom: 100%; border-color: transparent transparent #1f2937 transparent;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .tooltip-fade-in { animation: tooltipFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes tooltipFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ ТУЛТИПА --- */
        @media (max-width: 767px) {
            #selection-tooltip {
                position: fixed !important;
                top: auto !important;
                bottom: 24px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: calc(100% - 32px);
                max-width: 400px;
                padding: 12px 8px;
                border-radius: 20px;
                justify-content: space-between;
                box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
                border: 1px solid rgba(255,255,255,0.1);
                background: rgba(31, 41, 55, 0.95);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
            #selection-tooltip::after { display: none !important; }
            
            .tooltip-fade-in { animation: slideUpMobile 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important; }
            @keyframes slideUpMobile {
                from { opacity: 0; transform: translate(-50%, 40px) scale(0.95); }
                to { opacity: 1; transform: translate(-50%, 0) scale(1); }
            }
            
            #selection-tooltip button {
                flex-direction: column;
                padding: 10px 0;
                gap: 8px;
                flex: 1;
                border-radius: 14px;
                touch-action: manipulation; 
            }
            #selection-tooltip button svg { width: 24px; height: 24px; margin: 0 auto; }
            #selection-tooltip button span { display: block !important; font-size: 12px; font-weight: 500; }
            .tooltip-divider { display: none; }
        }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3.5s ease-in-out forwards; }

        #reading-progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: transparent; z-index: 100; }
        #reading-progress-bar { height: 100%; width: 0%; transition: width 0.1s ease-out; }
        html.dark #reading-progress-bar { background: #a67b5b; }
        html:not(.dark) #reading-progress-bar { background: #84593c; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 10px; }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col bg-mag-bg text-mag-text dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div id="reading-progress-container" class="hidden"><div id="reading-progress-bar"></div></div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-6 py-3 rounded-full shadow-2xl text-sm font-medium flex items-center gap-3 hidden transition-colors">
        <svg class="w-5 h-5 text-green-400 dark:text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Успешно!</span>

    <div id="edit-modal" class="fixed inset-0 z-[100] hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm p-6 rounded-2xl shadow-2xl border border-mag-border dark:border-gray-700">
            <h3 class="font-serif text-xl text-mag-text dark:text-gray-100 mb-4">Уточнить перевод</h3>
            <input type="text" id="edit-translation-input" class="w-full bg-gray-50 dark:bg-gray-900 border border-mag-border dark:border-gray-600 text-mag-text dark:text-white rounded-lg px-4 py-3 mb-6 outline-none focus:border-mag-primary dark:focus:border-mag-primaryLight transition-colors" placeholder="Введите точный перевод...">
            <div class="flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-4 py-2 text-sm font-medium text-mag-muted dark:text-gray-400 hover:text-mag-text dark:hover:text-white transition-colors">Отмена</button>
                <button onclick="saveEditedTranslation()" class="px-6 py-2 bg-mag-primary hover:bg-mag-primaryHover dark:bg-mag-primaryLight dark:hover:bg-[#8c6549] text-white rounded-lg text-sm font-medium transition-colors shadow-sm">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Всплывающее меню (Тултип) -->
    <div id="selection-tooltip" class="absolute z-50 hidden bg-gray-800 text-white rounded-xl shadow-2xl flex items-center p-1.5 tooltip-arrow mb-3 border border-gray-700" style="transform: translateX(-50%);">
        <button id="btn-listen" class="px-3 py-2 sm:py-1.5 text-sm hover:bg-gray-700 rounded-lg transition-colors flex items-center gap-1.5 whitespace-nowrap" title="Прослушать">
            <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
            <span class="hidden sm:inline">Слушать</span>
        </button>
        <div class="w-px h-6 bg-gray-600 mx-1 tooltip-divider"></div>
        <button id="btn-save-word" class="px-3 py-2 sm:py-1.5 text-sm hover:bg-gray-700 rounded-lg transition-colors flex items-center gap-1.5 whitespace-nowrap">
            <svg class="w-4 h-4 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
            Слово
        </button>
        <div class="w-px h-6 bg-gray-600 mx-1 tooltip-divider"></div>

            Перевод
        </button>
    </div>

    <div id="app" class="flex-grow flex flex-col w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">
        <div class="flex-grow flex flex-col items-center justify-center min-h-[50vh]" id="loading-screen">
            <svg class="animate-spin h-10 w-10 text-mag-primary dark:text-mag-primaryLight mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-mag-muted dark:text-gray-400 font-medium">Загрузка Magazine Learner...</p>
        </div>
    </div>

    <!-- КЛАССИЧЕСКИЙ СКРИПТ: Обходит блокировку модулей в Android WebView -->
    <script>
        // 1. Инициализация Telegram WebApp
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch (e) {}

        const safeStorage = {
            get: (key) => { try { return sessionStorage.getItem(key); } catch(e) { return null; } },
            set: (key, val) => { try { sessionStorage.setItem(key, val); } catch(e) {} },
            remove: (key) => { try { sessionStorage.removeItem(key); } catch(e) {} }
        };
        const safeLocal = {
            get: (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } },
            set: (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} }
        };

        const state = { 
            user: null, 
            profile: null, 
            view: 'auth', 
            dashboardTab: 'articles', 
            articles: [], 
            words: [], 
            quotes: [], 
            currentArticle: null, 
            selectedText: '', 
            selectedContext: '', 
            readerFontSize: 'text-base', 
            unsubs: [], 
            editingWordId: null,
            flashcards: [],
            flashcardIndex: 0,
            flashcardFlipped: false
        };
        
        const elements = {
            app: document.getElementById('app'),
            tooltip: document.getElementById('selection-tooltip'),
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toast-msg'),
            progressBarContainer: document.getElementById('reading-progress-container'),
            progressBar: document.getElementById('reading-progress-bar'),
            editModal: document.getElementById('edit-modal'),
            editInput: document.getElementById('edit-translation-input')
        };

        let fbApp, fbAuth, fbDb, fbMethods;
        let isLocalMode = false;
        const appId = "1:364208723805:web:3639e2ddde1f4e84277ab4";
        const firebaseConfig = {
            apiKey: "AIzaSyD7A24gqyocYPVkiMtRFWHoSDRp4egnGh8",
            authDomain: "magazine-learner.firebaseapp.com",
            projectId: "magazine-learner",
            storageBucket: "magazine-learner.firebasestorage.app",
            messagingSenderId: "364208723805",
            appId: appId
        };

        function loadProfileAndNavigate() {
            const savedProfile = safeStorage.get('mag_profile');
            if (savedProfile) {
                state.profile = savedProfile;
                navigateTo('dashboard');
            } else {
                navigateTo('auth');
            }
        }

        function navigateTo(view, data = null) {
            state.view = view;
            elements.tooltip.classList.add('hidden');
            elements.progressBarContainer.classList.add('hidden');
            if (window.speechSynthesis) window.speechSynthesis.cancel(); 

            if (data && view === 'reader') {
                state.currentArticle = data;
                window.addEventListener('scroll', updateProgress);
            } else {
                window.removeEventListener('scroll', updateProgress);
            }

            renderApp();
            
            if (view === 'dashboard' && state.user) setupFirestoreListeners();
            if (view === 'reader') {
                window.scrollTo(0, 0);
                elements.progressBarContainer.classList.remove('hidden');
            }
        }

        function clearListeners() {
            state.unsubs.forEach(unsub => unsub());
            state.unsubs = [];
        }

        function setupFirestoreListeners() {
            if (!state.user) return;
            clearListeners();

            if (isLocalMode || !fbDb) {
                state.articles = JSON.parse(safeLocal.get('mag_articles') || '[]').sort((a,b) => b.createdAt - a.createdAt);
                state.words = JSON.parse(safeLocal.get('mag_words') || '[]').filter(w => w.profile === state.profile).sort((a,b) => b.createdAt - a.createdAt);
                state.quotes = JSON.parse(safeLocal.get('mag_quotes') || '[]').filter(q => q.profile === state.profile).sort((a,b) => b.createdAt - a.createdAt);
                
                if(state.view === 'dashboard') {
                    if(state.dashboardTab === 'articles') renderApp();
                    else updateDashboardContent();
                }
                return;
            }

            try {
                const { collection, onSnapshot } = fbMethods;
                
                const articlesRef = collection(fbDb, 'artifacts', appId, 'public', 'data', 'articles');
                const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
                    const fetchedArticles = [];
                    snapshot.forEach(doc => fetchedArticles.push({ id: doc.id, ...doc.data() }));
                    fetchedArticles.sort((a, b) => b.createdAt - a.createdAt);
                    state.articles = fetchedArticles;
                    if(state.view === 'dashboard' && state.dashboardTab === 'articles') renderApp();
                });
                state.unsubs.push(unsubArticles);

                const wordsRef = collection(fbDb, 'artifacts', appId, 'public', 'data', 'saved_words');
                const unsubWords = onSnapshot(wordsRef, (snapshot) => {
                    const fetchedWords = [];
                    snapshot.forEach(doc => {
                        if(doc.data().profile === state.profile) fetchedWords.push({ id: doc.id, ...doc.data() });
                    });
                    fetchedWords.sort((a, b) => b.createdAt - a.createdAt);
                    state.words = fetchedWords;
                    if(state.view === 'dashboard' && state.dashboardTab === 'words') updateDashboardContent();
                });
                state.unsubs.push(unsubWords);

            } catch (error) { console.error("Listener error:", error); }
        }

        window.saveToFirestore = async function(type, text) {
            if (!state.user || !state.profile) return;
            
            elements.tooltip.classList.add('hidden');
            window.getSelection().removeAllRanges();

            let translation = "", phonetics = "", partOfSpeech = "";

            if (type === 'word') {
                showToast("Изучаем и переводим...");
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&dt=bd&q=${encodeURIComponent(text)}`;
                    const transRes = await fetch(url);
                    const transData = await transRes.json();
                    
                    let variants = [];
                    if (transData[1] && Array.isArray(transData[1])) {
                        transData[1].forEach(pos => {
                            if (pos[1] && Array.isArray(pos[1])) {
                                variants.push(...pos[1]);
                            }
                        });
                    }
                    
                    if (variants.length > 0) {
                        translation = [...new Set(variants)].slice(0, 4).join(', ');
                    } else if (transData && transData[0] && transData[0][0] && transData[0][0][0]) {
                        translation = transData[0][0][0];
                    }
                } catch (e) { }

                try {
                    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(text)}`);
                    if(dictRes.ok) {
                        const dictData = await dictRes.json();
                        if(dictData && dictData.length > 0) {
                            const entry = dictData[0];
                            if (entry.phonetic) phonetics = entry.phonetic;
                            else if (entry.phonetics && entry.phonetics.length > 0) {
                                const phoneObj = entry.phonetics.find(p => p.text);
                                if (phoneObj) phonetics = phoneObj.text;
                            }
                            if (entry.meanings && entry.meanings.length > 0) partOfSpeech = entry.meanings[0].partOfSpeech || "";
                        }
                    }
                } catch (e) { }
            }

            const itemObj = { 
                text, 
                translation, 
                phonetics, 
                partOfSpeech, 
                context: state.selectedContext, // Сохраняем найденный контекст
                profile: state.profile, 
                articleId: state.currentArticle ? state.currentArticle.id : null, 
                articleTitle: state.currentArticle ? state.currentArticle.title : 'Неизвестно', 
                createdAt: Date.now() 
            };

            if (isLocalMode || !fbDb) {
                const key = 'mag_words';
                const arr = JSON.parse(safeLocal.get(key) || '[]');
                itemObj.id = 'loc_' + Date.now() + Math.random().toString(36).substring(2, 9);
                arr.push(itemObj);
                safeLocal.set(key, JSON.stringify(arr));
                showToast(`Сохранено локально в Словарь`);
                if(state.view === 'dashboard') setupFirestoreListeners();
                return;
            }

            const collectionName = 'saved_words';
            const { collection, addDoc } = fbMethods;
            
            const colRef = collection(fbDb, 'artifacts', appId, 'public', 'data', collectionName);
                
            try {
                await addDoc(colRef, itemObj);
                showToast(`Сохранено в Словарь`);
            } catch (error) { showToast("Ошибка сохранения."); }
        };

        window.deleteItem = async function(type, docId) {
             if (!state.user) return;
             
             if (type === 'article') {
                if (isLocalMode || !fbDb) {
                    let arr = JSON.parse(safeLocal.get('mag_articles') || '[]');
                    arr = arr.filter(i => i.id !== docId);
                    safeLocal.set('mag_articles', JSON.stringify(arr));
                    showToast("Статья удалена");
                    setupFirestoreListeners();
                    return;
                }
                const { doc, deleteDoc } = fbMethods;
                const docRef = doc(fbDb, 'artifacts', appId, 'public', 'data', 'articles', docId);
                try { await deleteDoc(docRef); showToast("Статья удалена"); } catch(e) { showToast("Ошибка удаления"); }
                return;
             }

             if (isLocalMode || !fbDb) {
                 const key = 'mag_words';
                 let arr = JSON.parse(safeLocal.get(key) || '[]');
                 arr = arr.filter(i => i.id !== docId);
                 safeLocal.set(key, JSON.stringify(arr));
                 showToast("Удалено");
                 setupFirestoreListeners();
                 return;
             }

             const collectionName = 'saved_words';
             const { doc, deleteDoc } = fbMethods;

        // Обработка выделения текста и захват контекста
        function handleSelection() {
            if (state.view !== 'reader') return;
            
            setTimeout(() => {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;
                
                const text = selection.toString().trim();

                if (text.length > 0) {
                    state.selectedText = text;
                    
                    // Попытка захватить контекст (целое предложение)
                    let contextText = '';
                    const range = selection.getRangeAt(0);
                    if(range.startContainer) {
                        const block = range.startContainer.nodeType === 3 ? range.startContainer.parentNode.closest('p, div, blockquote, li, h2') : range.startContainer.closest('p, div, blockquote, li, h2');
                        if(block) {
                            const blockText = block.innerText || block.textContent || '';
                            // Разбиваем на предложения по точкам, воскл. и вопр. знакам
                            const sentences = blockText.split(/(?<=[.!?])\s+/);
                            contextText = sentences.find(s => s.includes(text)) || blockText;
                            if(contextText.length > 250) contextText = contextText.substring(0, 250) + "...";
                        }
                    }
                    state.selectedContext = contextText.trim();

                    const rect = range.getBoundingClientRect();
                    elements.tooltip.classList.remove('hidden');
                    
                    setTimeout(() => {
                        const tooltipWidth = elements.tooltip.offsetWidth;
                        const tooltipHeight = elements.tooltip.offsetHeight;
                        const isMobile = window.innerWidth < 768; 

                        if (!isMobile) {
                            let leftPos = rect.left + window.scrollX + (rect.width / 2);
                            const padding = 15;
                            
                            if (leftPos - tooltipWidth/2 < window.scrollX + padding) leftPos = window.scrollX + tooltipWidth/2 + padding;
                            if (leftPos + tooltipWidth/2 > window.innerWidth + window.scrollX - padding) leftPos = window.innerWidth + window.scrollX - tooltipWidth/2 - padding;

                            let topPos = rect.top + window.scrollY - tooltipHeight - 12;
                            
                            if (rect.top < tooltipHeight + 20) {
                                topPos = rect.bottom + window.scrollY + 12;
                                elements.tooltip.classList.add('tooltip-bottom');
                            } else {
                                elements.tooltip.classList.remove('tooltip-bottom');
                            }

                            elements.tooltip.style.position = 'absolute';
                            elements.tooltip.style.top = `${topPos}px`;
                            elements.tooltip.style.left = `${leftPos}px`;
                            elements.tooltip.style.bottom = 'auto';
                            elements.tooltip.style.transform = 'translateX(-50%)';
                        } else {
                            elements.tooltip.style.position = '';
                            elements.tooltip.style.top = '';
                            elements.tooltip.style.left = '';
                            elements.tooltip.style.bottom = '';
                            elements.tooltip.style.transform = '';
                            elements.tooltip.classList.remove('tooltip-bottom');
                        }

                        elements.tooltip.classList.add('tooltip-fade-in');
                    }, 10);
                } else {
                    setTimeout(() => elements.tooltip.classList.add('hidden'), 100);
                }
            }, 50);
        }

            const textarea = document.getElementById('admin-content');
            if(!textarea) return;

            if(tag === 'p') insertStr = '<p>Обычный абзац текста...</p>\n';
            if(tag === 'dropcap') insertStr = '<p class="drop-cap">Первая буква этого абзаца будет большой и красивой. Журнальный стиль.</p>\n';
            if(tag === 'quote') insertStr = '<blockquote>Текст красивой цитаты...</blockquote>\n';
            if(tag === 'list') insertStr = '<ul>\n  <li>Первый пункт</li>\n  <li>Второй пункт</li>\n</ul>\n';
            if(tag === 'hr') insertStr = '\n<hr>\n';
            if(tag === 'img') insertStr = '<img src="https://images.unsplash.com/photo-1522204523234-8729aa6e3d5f?w=800&q=80" alt="Фото">\n<figcaption>Красивая подпись к фотографии</figcaption>\n';
            if(tag === 'mark') insertStr = '<mark>Выделенный текст</mark>';
            if(tag === 'bold') insertStr = '<strong>Жирный текст</strong>';
            
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + insertStr + text.substring(end);
            textarea.focus();
            if (start === end) { textarea.selectionStart = start; textarea.selectionEnd = start + insertStr.length; }
        };

        window.autoFormatText = () => {
            const textarea = document.getElementById('admin-content');
            if(!textarea || !textarea.value.trim()) return showToast("Сначала вставьте текст!");
            
            const blocks = textarea.value.split(/\n\s*\n/);
            let formatted = '';

            blocks.forEach((block, idx) => {
                let cleanBlock = block.trim();
                if (!cleanBlock) return;
                if (cleanBlock.startsWith('<')) { formatted += cleanBlock + '\n\n'; return; }
                const isQuote = /^["«“](.*)["»”]$/s.test(cleanBlock);
                const isHeading = cleanBlock.length < 85 && !/[.!?:]$/.test(cleanBlock) && idx !== 0 && !cleanBlock.includes('\n');

                if (idx === 0) formatted += `<p class="drop-cap">${cleanBlock.replace(/\n/g, ' ')}</p>\n\n`;
                else if (isQuote) formatted += `<blockquote>${cleanBlock.replace(/^["«“](.*)["»”]$/s, '$1').replace(/\n/g, ' ')}</blockquote>\n\n`;
                else if (isHeading) formatted += `<h2>${cleanBlock}</h2>\n\n`;
                else formatted += `<p>${cleanBlock.replace(/\n/g, ' ')}</p>\n\n`;
            });
            textarea.value = formatted.trim();
            showToast("✨ Магия применена!");
        };

        // ДИНАМИЧЕСКИЙ ЗАПУСК FIREBASE С ПЕРЕХВАТОМ ОШИБОК
        async function bootApplication() {
            const timeout = setTimeout(() => {
                if (state.view === 'auth' || !state.user) {
                    console.warn("Сработало ограничение WebView на загрузку модулей. Запуск локального режима.");
                    isLocalMode = true;
                    loadProfileAndNavigate();
                }
            }, 3000); // 3 секунды на ответ

            try {
                const fbAppModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const fbAuthModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const fbDbModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                fbMethods = {
                    collection: fbDbModule.collection,
                    doc: fbDbModule.doc,
                    setDoc: fbDbModule.setDoc,
                    deleteDoc: fbDbModule.deleteDoc,
                    onSnapshot: fbDbModule.onSnapshot,
                    addDoc: fbDbModule.addDoc
                };

                fbApp = fbAppModule.initializeApp(firebaseConfig);
                fbAuth = fbAuthModule.getAuth(fbApp);
                fbDb = fbDbModule.getFirestore(fbApp);

                await fbAuthModule.setPersistence(fbAuth, fbAuthModule.inMemoryPersistence).catch(() => {});

                let authPromise;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    authPromise = fbAuthModule.signInWithCustomToken(fbAuth, __initial_auth_token).catch(() => fbAuthModule.signInAnonymously(fbAuth));
                } else {
                    authPromise = fbAuthModule.signInAnonymously(fbAuth);
                }

                await authPromise;

                fbAuthModule.onAuthStateChanged(fbAuth, (user) => {
                    clearTimeout(timeout);
                    if (isLocalMode) return;
                    state.user = user;
                    loadProfileAndNavigate();
                });

            } catch (e) {
                console.error("Android System WebView заблокировал Firebase:", e);
                clearTimeout(timeout);
                isLocalMode = true;
                loadProfileAndNavigate();
            }
        }

        bootApplication();
    </script>
</body>
</html>
