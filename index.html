<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazine Learner</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mag: {
                            bg: '#fcfaf7',
                            surface: '#ffffff',
                            primary: '#84593c',
                            primaryHover: '#6a4730',
                            primaryLight: '#a67b5b',
                            text: '#222222',
                            muted: '#666666',
                            border: '#e8e2d9',
                            highlight: '#fdf3e7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'premium-dark': '0 4px 20px -2px rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>

    <script>
        try {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) {
            console.warn("Storage access restricted");
        }
    </script>

    <style>
        body { 
            overflow-y: scroll; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html { scroll-behavior: smooth; }
        
        .article-content { transition: font-size 0.3s ease; }
        .article-content.text-sm { font-size: 1rem; }
        .article-content.text-base { font-size: 1.125rem; }
        .article-content.text-lg { font-size: 1.25rem; }

        .article-content p { margin-bottom: 1.75rem; line-height: 1.8; color: inherit; }
        .article-content h2 { font-family: 'Playfair Display', serif; font-size: 1.875rem; margin-top: 2.5rem; margin-bottom: 1.25rem; font-weight: 600; }
        
        html.dark .article-content h2 { color: #a67b5b; }
        html:not(.dark) .article-content h2 { color: #84593c; }

        .article-content blockquote { position: relative; padding-left: 2rem; font-style: italic; margin: 2.5rem 0; font-size: 1.1em; line-height: 1.7; }
        html.dark .article-content blockquote { color: #d1d5db; }
        html:not(.dark) .article-content blockquote { color: #444; }

        .article-content blockquote::before { content: "“"; position: absolute; left: 0; top: -10px; font-size: 3rem; font-family: 'Playfair Display', serif; }
        html.dark .article-content blockquote::before { color: #374151; }
        html:not(.dark) .article-content blockquote::before { color: #e8e2d9; }
        
        .article-content .drop-cap::first-letter { float: left; font-size: 3.5em; line-height: 0.8; padding-right: 0.15em; padding-top: 0.1em; font-family: 'Playfair Display', serif; color: #84593c; }
        html.dark .article-content .drop-cap::first-letter { color: #a67b5b; }

        .article-content ul, .article-content ol { margin: 1.5rem 0 1.5rem 1.5rem; }
        .article-content li { margin-bottom: 0.75rem; }
        .article-content ul li { list-style-type: disc; }
        .article-content ul li::marker { color: #84593c; }
        html.dark .article-content ul li::marker { color: #a67b5b; }
        .article-content ol li { list-style-type: decimal; font-weight: 500;}

        .article-content hr { border: none; text-align: center; margin: 3.5rem 0; }
        .article-content hr::before { content: "✦ \u00A0 ✦ \u00A0 ✦"; font-size: 1.25rem; color: #d1d5db; }
        html.dark .article-content hr::before { color: #4b5563; }

        .article-content img { border-radius: 0.75rem; max-width: 100%; height: auto; margin: 2.5rem auto 1rem auto; display: block; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.1); }
        html.dark .article-content img { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4); opacity: 0.9; }
        .article-content figcaption { text-align: center; font-size: 0.9rem; color: #6b7280; margin-bottom: 2.5rem; font-style: italic; }
        html.dark .article-content figcaption { color: #9ca3af; }

        .article-content mark { background-color: #fdf3e7; color: inherit; padding: 0.1em 0.3em; border-radius: 0.25rem; }
        html.dark .article-content mark { background-color: rgba(166, 123, 91, 0.2); }
        .article-content strong { font-weight: 600; }

        /* Тултип (Всплывающее меню) */
        .tooltip-arrow::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: #1f2937 transparent transparent transparent;
        }
        .tooltip-arrow.tooltip-bottom::after {
            top: auto; bottom: 100%; border-color: transparent transparent #1f2937 transparent;
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .tooltip-fade-in { animation: tooltipFadeIn 0.2s ease-out forwards; }
        @keyframes tooltipFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3.5s ease-in-out forwards; }

        #reading-progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: transparent; z-index: 100; }
        #reading-progress-bar { height: 100%; width: 0%; transition: width 0.1s ease-out; }
        html.dark #reading-progress-bar { background: #a67b5b; }
        html:not(.dark) #reading-progress-bar { background: #84593c; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 10px; }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col bg-mag-bg text-mag-text dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div id="reading-progress-container" class="hidden"><div id="reading-progress-bar"></div></div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-6 py-3 rounded-full shadow-2xl text-sm font-medium flex items-center gap-3 hidden transition-colors">
        <svg class="w-5 h-5 text-green-400 dark:text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Успешно!</span>
    </div>

    <div id="edit-modal" class="fixed inset-0 z-[100] hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm p-6 rounded-2xl shadow-2xl border border-mag-border dark:border-gray-700">
            <h3 class="font-serif text-xl text-mag-text dark:text-gray-100 mb-4">Уточнить перевод</h3>
            <input type="text" id="edit-translation-input" class="w-full bg-gray-50 dark:bg-gray-900 border border-mag-border dark:border-gray-600 text-mag-text dark:text-white rounded-lg px-4 py-3 mb-6 outline-none focus:border-mag-primary dark:focus:border-mag-primaryLight transition-colors" placeholder="Введите точный перевод...">
            <div class="flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-4 py-2 text-sm font-medium text-mag-muted dark:text-gray-400 hover:text-mag-text dark:hover:text-white transition-colors">Отмена</button>
                <button onclick="saveEditedTranslation()" class="px-6 py-2 bg-mag-primary hover:bg-mag-primaryHover dark:bg-mag-primaryLight dark:hover:bg-[#8c6549] text-white rounded-lg text-sm font-medium transition-colors shadow-sm">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="selection-tooltip" class="absolute z-50 hidden bg-gray-800 text-white rounded-xl shadow-2xl flex items-center p-1.5 tooltip-arrow mb-3 border border-gray-700" style="transform: translateX(-50%);">
        <button id="btn-listen" class="px-5 py-4 sm:px-4 sm:py-2 text-sm hover:bg-gray-700 rounded-lg transition-colors flex items-center gap-2 whitespace-nowrap active:bg-gray-600" title="Прослушать">
            <svg class="w-6 h-6 sm:w-4 sm:h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
            <span class="hidden sm:inline">Слушать</span>
        </button>
        <div class="w-px h-8 sm:h-6 bg-gray-600 mx-1"></div>
        <button id="btn-save-word" class="px-5 py-4 sm:px-4 sm:py-2 text-sm hover:bg-gray-700 rounded-lg transition-colors flex items-center gap-2 whitespace-nowrap active:bg-gray-600">
            <svg class="w-6 h-6 sm:w-4 sm:h-4 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
            Слово
        </button>
        <div class="w-px h-8 sm:h-6 bg-gray-600 mx-1"></div>
        <button id="btn-translate" class="px-5 py-4 sm:px-4 sm:py-2 text-sm hover:bg-gray-700 rounded-lg transition-colors flex items-center gap-2 whitespace-nowrap text-blue-300 active:bg-gray-600">
            <svg class="w-6 h-6 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
            <span class="hidden sm:inline">Перевод</span>
        </button>
    </div>

    <div id="app" class="flex-grow flex flex-col w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">
        <div class="flex-grow flex flex-col items-center justify-center min-h-[50vh]">
            <svg class="animate-spin h-10 w-10 text-mag-primary dark:text-mag-primaryLight mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-mag-muted dark:text-gray-400 font-medium">Загрузка Magazine Learner...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let isLocalMode = false;
        const firebaseConfig = {
            apiKey: "AIzaSyD7A24gqyocYPVkiMtRFWHoSDRp4egnGh8",
            authDomain: "magazine-learner.firebaseapp.com",
            projectId: "magazine-learner",
            storageBucket: "magazine-learner.firebasestorage.app",
            messagingSenderId: "364208723805",
            appId: "1:364208723805:web:3639e2ddde1f4e84277ab4"
        };

        const appId = firebaseConfig.appId;
        let app, auth, db;
        
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) {
            console.warn("Firebase Init fallback to Local Mode:", e);
            isLocalMode = true;
        }

        const state = {
            user: null,
            profile: null,
            view: 'auth', 
            dashboardTab: 'articles', 
            articles: [],
            words: [],
            currentArticle: null,
            selectedText: '',
            readerFontSize: 'text-base', 
            unsubs: [],
            editingWordId: null 
        };

        const elements = {
            app: document.getElementById('app'),
            tooltip: document.getElementById('selection-tooltip'),
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toast-msg'),
            progressBarContainer: document.getElementById('reading-progress-container'),
            progressBar: document.getElementById('reading-progress-bar'),
            editModal: document.getElementById('edit-modal'),
            editInput: document.getElementById('edit-translation-input')
        };

        // Безопасное чтение/запись в хранилище (для предотвращения ошибок на iOS)
        const safeStorage = {
            get: (key) => { try { return sessionStorage.getItem(key); } catch(e) { return null; } },
            set: (key, val) => { try { sessionStorage.setItem(key, val); } catch(e) {} },
            remove: (key) => { try { sessionStorage.removeItem(key); } catch(e) {} }
        };
        const safeLocal = {
            get: (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } },
            set: (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} }
        };

        const loadProfileAndNavigate = () => {
            const savedProfile = safeStorage.get('mag_profile');
            if (savedProfile) {
                state.profile = savedProfile;
                navigateTo('dashboard');
            } else {
                navigateTo('auth');
            }
        };

        const initAuth = async () => {
            // Усиленная проверка: если Firebase не смог загрузиться (например, в Telegram WebView)
            if (isLocalMode || typeof auth === 'undefined' || !auth) {
                console.warn("Forcing Local Mode due to environment restrictions (e.g. Telegram Mini App)");
                isLocalMode = true;
                state.user = { uid: 'local_user_123' };
                loadProfileAndNavigate();
                return;
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (customTokenError) {
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (isLocalMode) return;
                    state.user = user;
                    loadProfileAndNavigate();
                });
            } catch (error) {
                console.warn("Auth error, forcing local mode");
                isLocalMode = true;
                state.user = { uid: 'local_user_123' };
                loadProfileAndNavigate();
            }
        };

        const navigateTo = (view, data = null) => {
            state.view = view;
            elements.tooltip.classList.add('hidden');
            elements.progressBarContainer.classList.add('hidden');
            window.speechSynthesis.cancel(); 

            if (data && view === 'reader') {
                state.currentArticle = data;
                window.addEventListener('scroll', updateProgress);
            } else {
                window.removeEventListener('scroll', updateProgress);
            }

            renderApp();
            
            if (view === 'dashboard' && state.user) setupFirestoreListeners();
            if (view === 'reader') {
                window.scrollTo(0, 0);
                elements.progressBarContainer.classList.remove('hidden');
            }
        };

        const clearListeners = () => {
            state.unsubs.forEach(unsub => unsub());
            state.unsubs = [];
        };

        const loadLocalData = () => {
            state.articles = JSON.parse(safeLocal.get('mag_articles') || '[]').sort((a,b) => b.createdAt - a.createdAt);
            state.words = JSON.parse(safeLocal.get('mag_words') || '[]').filter(w => w.profile === state.profile).sort((a,b) => b.createdAt - a.createdAt);
        };

        const setupFirestoreListeners = () => {
            if (!state.user) return;
            clearListeners();

            if (isLocalMode) {
                loadLocalData();
                if(state.view === 'dashboard') {
                    if(state.dashboardTab === 'articles') renderApp();
                    else updateDashboardContent();
                }
                return;
            }

            try {
                const articlesRef = collection(db, 'artifacts', appId, 'public', 'data', 'articles');
                const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
                    const fetchedArticles = [];
                    snapshot.forEach(doc => fetchedArticles.push({ id: doc.id, ...doc.data() }));
                    fetchedArticles.sort((a, b) => b.createdAt - a.createdAt);
                    state.articles = fetchedArticles;
                    if(state.view === 'dashboard' && state.dashboardTab === 'articles') renderApp();
                });
                state.unsubs.push(unsubArticles);

                const wordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'saved_words');
                const unsubWords = onSnapshot(wordsRef, (snapshot) => {
                    const fetchedWords = [];
                    snapshot.forEach(doc => {
                        if(doc.data().profile === state.profile) fetchedWords.push({ id: doc.id, ...doc.data() });
                    });
                    fetchedWords.sort((a, b) => b.createdAt - a.createdAt);
                    state.words = fetchedWords;
                    if(state.view === 'dashboard') updateDashboardContent();
                });
                state.unsubs.push(unsubWords);
            } catch (error) {
                console.error("Listener error:", error);
            }
        };

        const saveToFirestore = async (type, text) => {
            if (!state.user || !state.profile) return;
            
            elements.tooltip.classList.add('hidden');
            window.getSelection().removeAllRanges();

            let translation = "", phonetics = "", partOfSpeech = "";

            if (type === 'word') {
                showToast("Изучаем и переводим...");
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(text)}`;
                    const transRes = await fetch(url);
                    const transData = await transRes.json();
                    if (transData && transData[0] && transData[0][0] && transData[0][0][0]) {
                        translation = transData[0][0][0];
                    }
                } catch (e) { }

                try {
                    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(text)}`);
                    if(dictRes.ok) {
                        const dictData = await dictRes.json();
                        if(dictData && dictData.length > 0) {
                            const entry = dictData[0];
                            if (entry.phonetic) phonetics = entry.phonetic;
                            else if (entry.phonetics && entry.phonetics.length > 0) {
                                const phoneObj = entry.phonetics.find(p => p.text);
                                if (phoneObj) phonetics = phoneObj.text;
                            }
                            if (entry.meanings && entry.meanings.length > 0) {
                                partOfSpeech = entry.meanings[0].partOfSpeech || "";
                            }
                        }
                    }
                } catch (e) { }
            }

            const itemObj = { text, translation, phonetics, partOfSpeech, profile: state.profile, articleId: state.currentArticle ? state.currentArticle.id : null, articleTitle: state.currentArticle ? state.currentArticle.title : 'Неизвестно', createdAt: Date.now() };

            if (isLocalMode) {
                const arr = JSON.parse(safeLocal.get('mag_words') || '[]');
                itemObj.id = 'loc_' + Date.now() + Math.random().toString(36).substring(2, 9);
                arr.push(itemObj);
                safeLocal.set('mag_words', JSON.stringify(arr));
                showToast(`Сохранено локально в Словарь`);
                if(state.view === 'dashboard') setupFirestoreListeners();
                return;
            }

            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'saved_words');
            try {
                await addDoc(colRef, itemObj);
                showToast(`Сохранено в Словарь`);
            } catch (error) { 
                console.error("Ошибка сохранения в БД:", error);
                showToast("Ошибка базы данных."); 
            }
        };

        const deleteFromFirestore = async (type, docId) => {
             if (!state.user) return;
             
             if (type === 'article') {
                if (isLocalMode) {
                    let arr = JSON.parse(safeLocal.get('mag_articles') || '[]');
                    arr = arr.filter(i => i.id !== docId);
                    safeLocal.set('mag_articles', JSON.stringify(arr));
                    showToast("Статья удалена");
                    setupFirestoreListeners();
                    return;
                }
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'articles', docId);
                try {
                    await deleteDoc(docRef);
                    showToast("Статья удалена");
                } catch(error) { showToast("Ошибка удаления статьи"); }
                return;
             }

             if (isLocalMode) {
                 let arr = JSON.parse(safeLocal.get('mag_words') || '[]');
                 arr = arr.filter(i => i.id !== docId);
                 safeLocal.set('mag_words', JSON.stringify(arr));
                 showToast("Удалено");
                 setupFirestoreListeners();
                 return;
             }

             const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'saved_words', docId);
             try { await deleteDoc(docRef); showToast("Удалено"); } 
             catch(error) { showToast("Ошибка удаления"); }
        };

        const publishArticle = async (title, content) => {
            if (!state.user) return showToast("Ошибка: вы не авторизованы.");
            
            const articleObj = { title, content, createdAt: Date.now(), authorProfile: state.profile };

            if (isLocalMode) {
                articleObj.id = 'art_' + Date.now();
                const arr = JSON.parse(safeLocal.get('mag_articles') || '[]');
                arr.push(articleObj);
                safeLocal.set('mag_articles', JSON.stringify(arr));
                showToast("Статья сохранена локально!");
                navigateTo('dashboard');
                return;
            }

            try {
                const articlesRef = collection(db, 'artifacts', appId, 'public', 'data', 'articles');
                await addDoc(articlesRef, articleObj);
                showToast("Статья опубликована!");
                navigateTo('dashboard');
            } catch (error) {
                console.error("ОШИБКА ПУБЛИКАЦИИ FIRESTORE:", error);
                showToast("Ошибка публикации базы данных.");
            }
        };

        // Адаптированная логика выделения текста для Мобильных и ПК
        const handleSelection = () => {
            if (state.view !== 'reader') return;
            
            setTimeout(() => {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;
                
                const text = selection.toString().trim();

                if (text.length > 0) {
                    state.selectedText = text;
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();

                    elements.tooltip.classList.remove('hidden');
                    
                    // Небольшая задержка для получения корректных размеров
                    setTimeout(() => {
                        const tooltipWidth = elements.tooltip.offsetWidth;
                        const tooltipHeight = elements.tooltip.offsetHeight;
                        
                        let leftPos = rect.left + window.scrollX + (rect.width / 2);
                        const padding = 15;
                        
                        if (leftPos - tooltipWidth/2 < window.scrollX + padding) leftPos = window.scrollX + tooltipWidth/2 + padding;
                        if (leftPos + tooltipWidth/2 > window.innerWidth + window.scrollX - padding) leftPos = window.innerWidth + window.scrollX - tooltipWidth/2 - padding;

                        let topPos = rect.top + window.scrollY - tooltipHeight - 12;
                        const isMobile = window.innerWidth < 768; // Проверяем, телефон ли это
                        
                        // НА ТЕЛЕФОНАХ всегда стараемся показывать снизу, чтобы не перекрывать системное меню Android/iOS
                        // Если сверху мало места - тоже показываем снизу.
                        if (isMobile || rect.top < tooltipHeight + 20) {
                            topPos = rect.bottom + window.scrollY + 12;
                            elements.tooltip.classList.add('tooltip-bottom');
                        } else {
                            elements.tooltip.classList.remove('tooltip-bottom');
                        }

                        elements.tooltip.style.top = `${topPos}px`;
                        elements.tooltip.style.left = `${leftPos}px`;
                        elements.tooltip.classList.add('tooltip-fade-in');
                    }, 10);
                } else {
                    // Не прячем мгновенно, чтобы успел отработать клик по кнопке
                    setTimeout(() => elements.tooltip.classList.add('hidden'), 100);
                }
            }, 100);
        };

        // Убрали проблемные e.preventDefault() которые блокировали нажатие кнопок на телефонах
        
        document.addEventListener('mouseup', (e) => {
            if (elements.tooltip.contains(e.target) || e.target.closest('#selection-tooltip')) return;
            handleSelection();
        });

        // Поддержка сенсорных устройств (мобильные)

        });

            // зарегистрировать "click" на кнопке ДО того, как меню исчезнет из-за снятия выделения.
            window.selectionTimeout = setTimeout(() => {
                const selection = window.getSelection();
                if (!selection || selection.toString().trim().length === 0) {
                    elements.tooltip.classList.add('hidden');
                    elements.tooltip.classList.remove('tooltip-fade-in');

            if(tag === 'p') insertStr = '<p>Обычный абзац текста...</p>\n';
            if(tag === 'dropcap') insertStr = '<p class="drop-cap">Первая буква этого абзаца будет большой и красивой. Журнальный стиль.</p>\n';
            if(tag === 'quote') insertStr = '<blockquote>Текст красивой цитаты...</blockquote>\n';
            if(tag === 'list') insertStr = '<ul>\n  <li>Первый пункт</li>\n  <li>Второй пункт</li>\n</ul>\n';
            if(tag === 'hr') insertStr = '\n<hr>\n';
            if(tag === 'img') insertStr = '<img src="https://images.unsplash.com/photo-1522204523234-8729aa6e3d5f?w=800&q=80" alt="Фото">\n<figcaption>Красивая подпись к фотографии</figcaption>\n';
            if(tag === 'mark') insertStr = '<mark>Выделенный текст</mark>';
            if(tag === 'bold') insertStr = '<strong>Жирный текст</strong>';
            
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + insertStr + text.substring(end);
            textarea.focus();
            if (start === end) { textarea.selectionStart = start; textarea.selectionEnd = start + insertStr.length; }

            const textarea = document.getElementById('admin-content');
            if(!textarea || !textarea.value.trim()) return showToast("Сначала вставьте текст!");
            
            const blocks = textarea.value.split(/\n\s*\n/);
            let formatted = '';

            blocks.forEach((block, idx) => {
                let cleanBlock = block.trim();
                if (!cleanBlock) return;
                if (cleanBlock.startsWith('<')) { formatted += cleanBlock + '\n\n'; return; }
                const isQuote = /^["«“](.*)["»”]$/s.test(cleanBlock);
                const isHeading = cleanBlock.length < 85 && !/[.!?:]$/.test(cleanBlock) && idx !== 0 && !cleanBlock.includes('\n');

                if (idx === 0) formatted += `<p class="drop-cap">${cleanBlock.replace(/\n/g, ' ')}</p>\n\n`;
                else if (isQuote) formatted += `<blockquote>${cleanBlock.replace(/^["«“](.*)["»”]$/s, '$1').replace(/\n/g, ' ')}</blockquote>\n\n`;
                else if (isHeading) formatted += `<h2>${cleanBlock}</h2>\n\n`;
                else formatted += `<p>${cleanBlock.replace(/\n/g, ' ')}</p>\n\n`;

                        <div class="flex items-center gap-3">
                            <h1 class="font-serif text-2xl md:text-3xl text-mag-text dark:text-gray-100">Magazine<span class="text-mag-primary dark:text-mag-primaryLight italic">Learner</span></h1>
                            ${isLocalMode ? '<span class="hidden md:inline-flex items-center px-2 py-0.5 text-[10px] uppercase tracking-wider font-bold bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400 rounded" title="Работает локально">Local Mode</span>' : ''}
                        </div>
                        <div class="flex items-center gap-2 md:gap-4">
                            <button onclick="toggleTheme()" class="p-2 text-mag-muted dark:text-gray-400 hover:text-mag-text dark:hover:text-white transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">${getThemeIcon()}</button>
                            <div class="hidden sm:flex items-center gap-2 bg-white dark:bg-gray-800 px-4 py-2 rounded-full border border-mag-border dark:border-gray-700 shadow-sm">
                                <div class="w-2 h-2 rounded-full bg-green-500"></div>
                                <span class="text-sm font-medium text-mag-text dark:text-gray-200">${state.profile}</span>
                            </div>
                            <button onclick="logout()" class="p-2 text-mag-muted dark:text-gray-400 hover:text-mag-text dark:hover:text-white transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            </button>
                        </div>
                    </nav>

                    <div class="mb-8 border-b border-mag-border dark:border-gray-700">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                            <div class="flex space-x-4 md:space-x-6 overflow-x-auto hide-scrollbar -mb-px w-full sm:w-auto">
                                <button id="tab-articles" onclick="setDashboardTab('articles')" class="pb-3 px-1 text-sm font-semibold tracking-wider uppercase border-b-2 transition-colors whitespace-nowrap">Библиотека</button>
                                <button id="tab-words" onclick="setDashboardTab('words')" class="pb-3 px-1 text-sm font-semibold tracking-wider uppercase border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap">
                                    Словарь <span class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-full text-xs">${state.words.length}</span>
                                </button>
                            </div>
                            <button onclick="goAdmin()" class="mb-3 shrink-0 flex items-center justify-center sm:justify-start gap-2 text-sm text-mag-muted dark:text-gray-400 hover:text-mag-primary dark:hover:text-mag-primaryLight transition-colors px-4 py-2 rounded-lg hover:bg-mag-highlight/30 dark:hover:bg-gray-800 border border-mag-border dark:border-gray-700 sm:border-none bg-white dark:bg-gray-800 sm:bg-transparent w-full sm:w-auto self-end sm:self-auto">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Написать статью
                            </button>
                        </div>
                    </div>

                    <div id="dashboard-content-area" class="pb-20 fade-in"></div>
                `;
            }
            else if (state.view === 'reader') {
                html = `
                    <nav class="flex justify-between items-center mb-6 md:mb-10 pb-4 border-b border-mag-border dark:border-gray-700 sticky top-0 bg-mag-bg dark:bg-gray-900 z-40 pt-4 transition-colors">
                        <button onclick="goHome()" class="text-mag-muted dark:text-gray-400 hover:text-mag-primary dark:hover:text-mag-primaryLight transition-colors flex items-center gap-2 font-medium">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> <span class="hidden sm:inline">Назад</span>
                        </button>
                        <div class="flex items-center gap-3 md:gap-4">
                            <div class="flex items-center gap-2 bg-white dark:bg-gray-800 px-3 py-1.5 rounded-full border border-mag-border dark:border-gray-700 shadow-sm">
                                <button onclick="changeFontSize(-1)" class="text-mag-muted dark:text-gray-400 hover:text-mag-text dark:hover:text-white p-1 font-serif text-sm">A-</button>
                                <div class="w-px h-4 bg-mag-border dark:bg-gray-600"></div>
                                <button onclick="changeFontSize(1)" class="text-mag-muted dark:text-gray-400 hover:text-mag-text dark:hover:text-white p-1 font-serif text-lg font-medium">A+</button>
                            </div>
                            <button onclick="toggleTheme()" class="p-2 bg-white dark:bg-gray-800 border border-mag-border dark:border-gray-700 shadow-sm text-mag-muted dark:text-gray-400 hover:text-mag-text dark:hover:text-white transition-colors rounded-full">${getThemeIcon()}</button>
                        </div>
                    </nav>

                    <article class="max-w-3xl mx-auto w-full pb-32 fade-in px-2 sm:px-0">
                        <header class="mb-10 md:mb-14 text-center">
                            <p class="text-xs md:text-sm font-semibold text-mag-muted dark:text-gray-400 tracking-widest uppercase mb-4">${new Date(state.currentArticle.createdAt).toLocaleDateString('ru-RU', {month: 'long', day: 'numeric', year: 'numeric'})}</p>
                            <h1 class="font-serif text-3xl md:text-5xl lg:text-6xl text-mag-text dark:text-gray-100 leading-tight md:leading-tight mb-6 md:mb-8">${state.currentArticle.title}</h1>
                            <div class="flex justify-center items-center gap-3 md:gap-4 text-xs md:text-sm text-mag-muted dark:text-gray-400 mb-8">
                                <span class="flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> ${state.currentArticle.authorProfile || 'Редактор'}</span>
                                <span>•</span><span>${getReadingTime(state.currentArticle.content)} мин. чтения</span>
                            </div>
                            <div class="w-16 md:w-24 h-1 bg-mag-primary dark:bg-mag-primaryLight mx-auto rounded-full"></div>
                        </header>
                        <div id="reader-content" class="article-content ${state.readerFontSize}">${state.currentArticle.content}</div>
                        <div class="mt-16 md:mt-24 text-center border-t border-mag-border dark:border-gray-700 pt-10">
                            <p class="text-mag-muted dark:text-gray-400 italic font-serif text-lg md:text-xl">Конец статьи</p>
                            <button onclick="goHome()" class="mt-6 inline-block bg-white dark:bg-gray-800 border border-mag-border dark:border-gray-700 text-mag-text dark:text-gray-200 px-6 md:px-8 py-3 rounded-full hover:border-mag-primary dark:hover:border-mag-primaryLight hover:text-mag-primary dark:hover:text-mag-primaryLight transition-colors shadow-sm font-medium text-sm md:text-base">Вернуться в Библиотеку</button>
                        </div>
                    </article>
                `;
            }
            else if (state.view === 'admin') {
                html = `
                     <nav class="flex justify-between items-center mb-8 pb-4 border-b border-mag-border dark:border-gray-700">
                        <button onclick="goHome()" class="text-mag-muted dark:text-gray-400 hover:text-mag-primary dark:hover:text-mag-primaryLight transition-colors flex items-center gap-2 font-medium">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Отмена
                        </button>
                        <span class="font-serif text-lg md:text-xl text-mag-text dark:text-gray-100">Панель Редактора</span>
                    </nav>

                    <div class="max-w-4xl mx-auto w-full bg-white dark:bg-gray-800 p-6 md:p-10 rounded-2xl border border-mag-border dark:border-gray-700 shadow-premium dark:shadow-premium-dark fade-in">
                        <form onsubmit="submitArticle(event)">
                            <div class="mb-6 md:mb-8">
                                <input type="text" id="admin-title" required class="w-full bg-transparent border-b-2 border-mag-border dark:border-gray-700 focus:border-mag-primary dark:focus:border-mag-primaryLight py-3 outline-none transition-colors font-serif text-2xl md:text-4xl text-mag-text dark:text-gray-100 placeholder-gray-300 dark:placeholder-gray-600" placeholder="Заголовок статьи...">
                            </div>
                            <div class="mb-4">
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-xs font-semibold text-mag-muted dark:text-gray-400 uppercase tracking-widest">Элементы оформления</label>
                                    <button type="button" onclick="autoFormatText()" class="text-xs font-bold bg-gradient-to-r from-purple-500 to-indigo-500 text-white px-3 py-1.5 rounded-full hover:from-purple-600 hover:to-indigo-600 transition-all shadow-sm flex items-center gap-1.5">✨ Авто-магия</button>
                                </div>
                                <div class="flex flex-wrap gap-2 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-mag-border dark:border-gray-700">
                                    <button type="button" onclick="insertHtml('h2')" class="px-3 py-1.5 bg-white dark:bg-gray-600 border border-gray-200 dark:border-gray-500 rounded-lg text-sm font-serif font-bold text-gray-700 dark:text-gray-200 shadow-sm">H2</button>
                                    <button type="button" onclick="insertHtml('p')" class="px-3 py-1.5 bg-white dark:bg-gray-600 border border-gray-200 dark:border-gray-500 rounded-lg text-sm font-sans font-medium text-gray-700 dark:text-gray-200 shadow-sm">Абзац</button>
                                    <button type="button" onclick="insertHtml('dropcap')" class="px-3 py-1.5 bg-mag-highlight dark:bg-[#4a3826] border border-mag-primary/30 rounded-lg text-sm font-serif text-mag-primary dark:text-mag-primaryLight shadow-sm flex items-center gap-1"><span class="text-lg leading-none">Б</span>уквица</button>
                                    <div class="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1 self-center"></div>
                                    <button type="button" onclick="insertHtml('quote')" class="px-3 py-1.5 bg-white dark:bg-gray-600 border border-gray-200 dark:border-gray-500 rounded-lg text-sm font-serif italic text-gray-700 dark:text-gray-200 shadow-sm">" Цитата "</button>
                                    <button type="button" onclick="insertHtml('list')" class="px-3 py-1.5 bg-white dark:bg-gray-600 border border-gray-200 dark:border-gray-500 rounded-lg text-sm font-sans text-gray-700 dark:text-gray-200 shadow-sm">Список</button>
                                    <button type="button" onclick="insertHtml('hr')" class="px-3 py-1.5 bg-white dark:bg-gray-600 border border-gray-200 dark:border-gray-500 rounded-lg text-sm font-sans text-gray-700 dark:text-gray-200 shadow-sm">✦ ✦ ✦</button>
                                </div>
                            </div>
                            <div class="mb-8">
                                <textarea id="admin-content" required rows="14" class="w-full p-4 md:p-6 bg-gray-50 dark:bg-gray-900/50 rounded-xl border border-mag-border dark:border-gray-700 focus:border-mag-primary dark:focus:border-mag-primaryLight outline-none transition-colors font-mono text-sm leading-relaxed resize-y dark:text-gray-300" placeholder="<p class='drop-cap'>Начните писать здесь...</p>"></textarea>
                            </div>
                            <div class="flex justify-end">
                                <button type="submit" class="w-full md:w-auto bg-mag-primary hover:bg-mag-primaryHover dark:bg-mag-primaryLight dark:hover:bg-[#8c6549] text-white px-8 md:px-10 py-3.5 rounded-full font-medium transition-all shadow-md flex items-center justify-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg> Опубликовать
                                </button>
                            </div>
                        </form>
                    </div>
                `;
            }

            elements.app.innerHTML = html;
            
            if(state.view === 'dashboard') {
                updateDashboardContent();
                updateDashboardTabsUI();
            }
        };

        // Запуск
        initAuth();

    </script>
</body>
</html>
